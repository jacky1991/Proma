# Docker 构建专用 bunfig
# 目的：让容器内的 bun install 用确定的 registry 下载，不受本机 ~/.bunfig 或默认行为影响。
#
# 关键：保留项目 bun.lock（不在本文件设 lockfile=false）。
#   - bun 1.3.9 在「有 lockfile」时采用 hoisted node_modules 布局：workspace 成员与传递依赖
#     （如 pi-ai 的 typebox、undici）被提升到顶层，运行时可直接解析。
#   - 一旦 lockfile=false，bun 退化为 isolated 布局（.bun 隔离），server-core 未声明的幽灵依赖
#     （typebox/undici/@modelcontextprotocol/sdk）与其 peer（@earendil-works/pi-*，consumer apps/server
#     未声明）将全部解析失败。hoist 才与本地开发一致。
#   - 早先设 lockfile=false 是为了规避 bun.lock 中 npmmirror 绝对 URL 与 registry 冲突；实测 bun 会用
#     本文件的 registry 作为下载源，lockfile 仅锁版本+integrity，二者不冲突，故无需再禁用 lockfile。
#
# registry：构建用 --network=host 直连 npmjs（无需代理）。生产 CI 在阿里云可改 npmmirror 加速
#           （lockfile=true 下 npmmirror 不会再触发 packument URL 拼接 bug）。
[install]
registry = "https://registry.npmjs.org/"
