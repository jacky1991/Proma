# GitHub Actions: 发布 Docker 镜像
#
# 触发条件：推送 v* tag（如 v0.4.0）
# 构建 Proma Web 单镜像并推送到 GitHub Container Registry（ghcr.io）
# 镜像名：ghcr.io/<owner>/<repo>，tag 为版本号 + latest

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-docker:
    name: build & push docker image
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          docker build \
            -t "$IMAGE:${{ github.ref_name }}" \
            -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:${{ github.ref_name }}"
          docker push "$IMAGE:latest"
